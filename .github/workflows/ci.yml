name: MLOps Retrain & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  retrain-build-deploy:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🤖 Retrain pipeline & save model
      run: |
        echo "Running pipeline to generate artifacts/model.joblib..."
        python - <<'PYCODE'
        from src.config import config
        from src.pipeline.pipeline import FraudDetectionPipeline
        config.CONFIG["debug_mode"] = False  # set True for faster runs
        FraudDetectionPipeline().orchestrated_pipeline()
        PYCODE

    - name: 🛠 Ensure artifacts folder is in build context
      run: |
        echo "Checking .dockerignore..."
        if [ -f .dockerignore ]; then
          grep -v '^artifacts/' .dockerignore > .dockerignore.tmp || true
          mv .dockerignore.tmp .dockerignore
        fi
        ls -lh artifacts/

    - name: 🔑 Log in to Docker registry
      uses: docker/login-action@v2
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: 🐳 Build & push Docker image
      run: |
        docker build -t ${{ env.DOCKER_USERNAME }}/fraud-api:latest .
        docker push ${{ env.DOCKER_USERNAME }}/fraud-api:latest

    - name: 🚀 Trigger redeploy on Render
      run: |
        curl -X POST \
          -H "Authorization: Bearer $RENDER_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{"serviceId": "'"$RENDER_SERVICE_ID"'"}' \
          https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys
